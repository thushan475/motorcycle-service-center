spring.application.name=motorcycle-service-api

# =========================================
# DATABASE CONFIGURATION
# =========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/motorcycle_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql

# =========================================
# JPA / HIBERNATE CONFIGURATION
# =========================================
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# =========================================
# JACKSON
# =========================================
spring.jackson.serialization.write-dates-as-timestamps=false

# =========================================
# SERVER
# =========================================
server.port=8080

# =========================================
# JWT
# =========================================
jwt.secret=motorcycleServiceSpringBootSecretKeyForJwtSigningMinimum256BitsLong
jwt.expiration=86400000

# =========================================
# SWAGGER
# =========================================
springdoc.swagger-ui.path=/swagger-ui.html

# =========================================
# LOGGING
# =========================================
logging.level.root=INFO
logging.level.com.thushan.motorcycleservice=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{36} - %msg%n


# =========================================
# EMAIL
# =========================================
