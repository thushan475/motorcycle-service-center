<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · Workshop Ops</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-page">
    <div class="auth-card">

        <div class="brand">
            <span class="brand-mark">MC</span>
            <span class="brand-text">Workshop&nbsp;Ops</span>
        </div>

        <h1>Create an account</h1>
        <p class="auth-subtitle">Registers a standard USER account</p>

        <div class="auth-error" id="register-error"></div>

        <form id="register-form">

            <div class="form-field">
                <label for="reg-username">Username</label>
                <input
                        type="text"
                        id="reg-username"
                        required
                        minlength="3"
                        maxlength="50"
                        autocomplete="username"
                >
            </div>

            <div class="form-field">
                <label for="reg-email">Email</label>
                <input
                        type="email"
                        id="reg-email"
                        required
                        autocomplete="email"
                >
            </div>

            <div class="form-field">
                <label for="reg-password">Password</label>
                <input
                        type="password"
                        id="reg-password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                >
                <span class="hint">At least 6 characters.</span>
            </div>

            <button
                    type="submit"
                    class="btn btn-primary"
                    style="width:100%"
                    id="register-btn"
            >
                Register
            </button>

        </form>

        <p class="auth-hint">
            Already have an account?
            <a href="index.html">Log in</a>
        </p>

    </div>
</div>

<div id="toast-stack"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="js/ajax/auth-api.js"></script>

<script src="js/ui.js"></script>

<script>if (localStorage.getItem('mc_token')) {
        window.location.href = 'dashboard.html';
    }

    $('#register-form').on('submit', function (e) {

        e.preventDefault();

        const payload = {
            username: $('#reg-username').val().trim(),
            email: $('#reg-email').val().trim(),
            password: $('#reg-password').val()
        };

        $('#register-error')
            .hide()
            .text('');

        $('#register-btn')
            .prop('disabled', true)
            .text('Registering...');

        AuthApi.register(payload)

            .then(() => {

                UI.toast(
                    'Account created. You can log in now.',
                    'success'
                );

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);

            })

            .catch((err) => {

                $('#register-error')
                    .text(err.message || 'Registration failed.')
                    .show();

            })

            .finally(() => {

                $('#register-btn')
                    .prop('disabled', false)
                    .text('Register');

            });

    });
</script>

</body>
</html>
